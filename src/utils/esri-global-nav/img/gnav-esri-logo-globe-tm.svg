<svg xmlns="http://www.w3.org/2000/svg"
     width="340" height="80"
     viewBox="0 0 340 80">
  <defs>
    <!-- soft drop shadow filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetBlur"/>
      <feFlood flood-color="#000" flood-opacity="0.2"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- White circle + shadow behind the cross -->
  <circle cx="40" cy="40" r="30"
          fill="#FFFFFF"
          filter="url(#dropShadow)" />

  <!-- Swiss-style Red Cross -->
  <!-- arm thickness = 10 (1/6 of 60), arm length = 20 (1/3 of 60) -->
  <!-- horizontal arm -->
  <rect x="20" y="35" width="40" height="10" fill="#ED1B2E"/>
  <!-- vertical arm -->
  <rect x="35" y="20" width="10" height="40" fill="#ED1B2E"/>

  <!-- Two-line label -->
  <text x="90" y="32"
        font-family="Montserrat, sans-serif"
        font-weight="600"
        font-size="18"
        fill="#6D6E70">
    <tspan x="90" dy="0">Lebanese</tspan>
    <tspan x="90" dy="1.2em">Red Cross</tspan>
  </text>

  <!-- Separator line -->
  <rect x="210" y="10" width="3" height="60" fill="#6D6E70"/>

  <!-- GIS label -->
  <text x="225" y="50"
        font-family="Montserrat, sans-serif"
        font-weight="700"
        font-size="32"
        fill="#ED1B2E">
    GIS
  </text>
</svg>
